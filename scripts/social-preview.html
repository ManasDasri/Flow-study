<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Flow social preview artwork</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
    <style>
        * { box-sizing: border-box; margin: 0; }
        body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Instrument Sans', sans-serif; color: #eff3e9; background: #101b16; }
        .coast { position: absolute; inset: 0 0 0 610px; background: linear-gradient(90deg, #101b16, #101b1626 35%, #0b181d55), url('../public/thunderstorm_wp.png') center / cover; }
        .copy { position: relative; z-index: 1; width: 640px; height: 100%; padding: 60px 64px; display: flex; flex-direction: column; }
        .brand { font-size: 44px; font-weight: 600; letter-spacing: -.075em; line-height: 1; }
        .brand span { color: #b6d3ac; }
        h1 { margin-top: 72px; font-size: 76px; font-weight: 600; line-height: 1.02; letter-spacing: -.055em; }
        .description { margin-top: 26px; max-width: 400px; color: #becbbd; font-size: 22px; line-height: 1.5; }
        .domain { margin-top: auto; color: #becbbd; font-size: 18px; }
        .timer { position: absolute; z-index: 1; top: 180px; right: 64px; width: 360px; padding: 28px; border: 1px solid #d1ddd840; border-radius: 20px; background: #101b16d9; box-shadow: 0 24px 70px #0003; }
        .timer-label { display: flex; align-items: center; gap: 9px; color: #becbbd; font-size: 17px; }
        .timer-label::before { content: ''; width: 7px; height: 7px; background: #b6d3ac; border-radius: 50%; }
        .time { font-size: 98px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.2; letter-spacing: -.065em; margin: 18px 0 24px; }
        .modes { display: flex; gap: 4px; padding: 4px; border: 1px solid #35483b; border-radius: 9px; font-size: 14px; color: #becbbd; }
        .modes span { flex: 1; text-align: center; padding: 9px 4px; white-space: nowrap; }
        .modes .selected { border-radius: 5px; background: #b6d3ac; color: #101b16; font-weight: 600; }
    </style>
</head>
<body>
    <div class="coast"></div>
    <div class="copy">
        <div class="brand">flow<span>.</span></div>
        <h1>Study better.<br>Together.</h1>
        <p class="description">A shared space for focused work.<br>Your timer, goals, and study group.</p>
        <div class="domain">flow-study.me</div>
    </div>
    <div class="timer">
        <div class="timer-label">Your next focus session</div>
        <div class="time">25:00</div>
        <div class="modes"><span class="selected">Focus</span><span>Break</span><span>Long break</span></div>
    </div>
</body>
</html>
